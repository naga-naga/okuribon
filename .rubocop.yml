# RuboCop の標準設定を出発点にする。
# 好みに合わない cop が出てきたら、その都度ここへ書き足す。

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "node_modules/**/*"
    - "storage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# --- 記法の好み ---

# %i[] %w[] は使わず、素直に [] で書く
Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

# 複数行のハッシュと配列で、末尾要素の後に改行が来るならカンマを付ける
# （要素を足したときの差分を1行に収めるため）。閉じかっこが末尾要素と
# 同じ行に来るならカンマは付けない。そこに要素を足しても差分は増えない。
# メソッド引数は対象にしない
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: diff_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: diff_comma

# 値の名前とキーが同じなら短縮形で書く（name: name ではなく name:）
Style/HashSyntax:
  EnforcedShorthandSyntax: always

# 行数や複雑度を数値で機械的に縛らない
Metrics:
  Enabled: false

# --- spec の書き方 ---

# spec は日本語で書くため、英語の語順を前提にした cop は使わない
RSpec/ContextWording:
  Enabled: false

# ひとつの example で複数の側面を確かめたい場面が多い
RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

# request spec には対応するコントローラか concern があるので、describe に定数を求める。
# 既定では spec/requests と type: request の両方が除外されているため、どちらも外す。
# spec/config は設定そのものを固定する spec で、渡せる定数が無いので除外に残す。
# spec/factories_spec.rb も同じで、確かめる相手は factory の定義であってモデルではない
RSpec/DescribeClass:
  Exclude:
    - "**/spec/config/**/*"
    - "**/spec/factories_spec.rb"
    - "**/spec/features/**/*"
    - "**/spec/routing/**/*"
    - "**/spec/system/**/*"
    - "**/spec/views/**/*"
  IgnoredMetadata:
    type:
      - channel
      - controller
      - helper
      - job
      - mailer
      - model
      - routing
      - view
      - feature
      - system
      - mailbox
      - aruba
      - task

# let は最初に参照された example でだけ評価されるため、
# どこで作られたのかが読めなくなる。即時評価の let! に揃える
# この cop は既定で無効なので明示的に有効化する
RSpec/Dialect:
  Enabled: true
  PreferredMethods:
    let: let!

# --- Rails の慣習 ---

# クラスに説明コメントを必須としない
Style/Documentation:
  Enabled: false
