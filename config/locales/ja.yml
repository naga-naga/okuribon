ja:
  # サービス名。画面と文書はかな、識別子（リポジトリ名・Kamal の service・DB 名・
  # サブドメイン）はローマ字の okuribon で通す（docs/spec.md 1.）。
  # 名前を書く場所はここ1つに絞る。以前は画面ごとに「読書交換会」と「Okuribon」が
  # 別々に書かれており、片方だけ直した状態に気付けなかった。
  # レイアウトを通らない public/500.html と 406 だけは直に持つ（6.10）。
  # そちらがここと食い違わないことは spec/requests/errors_controller_spec.rb で押さえる
  service:
    name: おくりぼん
  date:
    formats:
      # 表に詰めて並べる日付。rails-i18n の :short は月日を0で詰めるため、
      # 桁の揃った別の書式を持つ。年は出さない。1つの交換会は数週間で終わる
      compact: "%-m/%-d"
  time:
    formats:
      # 日程の表示。rails-i18n の :long は秒まで出るため、分までの書式を別に持つ
      schedule: "%Y年%-m月%-d日 %H:%M"
  exchange:
    phases:
      preparing: 準備中
      registration: 登録期間
      wish: 希望提出期間
      awaiting_matching: マッチング実行待ち
      published: 結果公開
    # 次に来る節目の呼び名。次の節目が無いフェーズは持たない
    next_deadlines:
      preparing: 登録期間の開始
      registration: 登録の締切
      wish: 希望提出の締切
    # 交換会トップの「あなたがすること」（docs/spec.md 6.1）。フェーズだけでは決まらず、
    # 自分の状態（取得枠・希望冊数・受け取った冊数）で言うことが変わる。
    # 組み立ては Exchanges::Todo に置く。交換会一覧のカードも同じ headline を並べる
    todos:
      preparing:
        headline: いまは待つだけです
        detail: "%{at}に登録期間が始まったら、贈りたい本を登録できます。登録した冊数と同じだけ受け取れます。"
      # 取得枠は登録した冊数で決まる。0冊のままだと受け取る権利が無いので、
      # 冊数を数えるより先に、そのことを伝える
      registration_none:
        headline: 本を登録する
        detail: まだ1冊も登録していません。このままだと受け取れる本が0冊になります。1冊でも登録すれば1冊受け取れます。
      registration:
        headline: 本を登録する
        detail: いま%{count}冊登録しています。増やすとその分だけ受け取れます。
      wish_empty:
        headline: 希望リストを作る
        detail: 希望リストがまだ空です。出さないままだと、余った本がランダムに割り当てられます。
      # 冊数の目安（取得枠の2倍）は本の一覧が出す。ここで繰り返すと、
      # 同じ推奨が2画面に別の言い方で並ぶ
      wish:
        headline: 希望リストを整える
        detail: いま%{count}冊並べています。上位が他の人に取られると下位へ降りていくので、多く並べておくほど受け取りやすくなります。
      # 希望提出期間に入った時点で登録期間は終わっており、取得枠を増やす道が無い
      wish_without_slots:
        headline: 今回は本を受け取れません
        detail: 登録期間に本を登録しなかったため、取得枠が0冊です。希望リストを作っても受け取る本はありません。
      awaiting_matching:
        headline: 結果を待ちます
        detail: 希望の受付は%{at}に締め切りました。主催者がマッチングを実行すると結果が公開されます。この画面でできることはもうありません。
      # 主催者だけは待つ側ではない。押し忘れが起きやすいので（docs/spec.md 6.8）、
      # 押さないあいだ何が起きないのかを書く
      awaiting_matching_owner:
        headline: マッチングを実行する
        detail: 希望の受付は%{at}に締め切りました。あなたが実行するまで、参加者は結果を見られません。
      published:
        headline: あなたに%{count}冊届いています
        detail: "%{givers}からの本です。ギフトコードは結果画面で開けます。"
      published_none:
        headline: 受け取った本はありません
        detail: 取得枠はありましたが、割り当てられる本が残りませんでした。全体の結果は結果画面で見られます。
      published_without_slots:
        headline: 受け取った本はありません
        detail: 登録した冊数と同じだけ受け取る仕組みのため、1冊も登録しなかった今回は受け取る本がありません。全体の結果は結果画面で見られます。
    # 招待画面が見せる日程の3段。日時だけを並べても参加の判断材料にならないので、
    # その期間に何をするのかと、そこで効く決まりを添える。
    # 結果公開だけ「以降」にするのは、公開が主催者の実行で起き、日時で決まらないため
    schedule:
      steps:
        registration:
          name: 本を登録する
          note: 登録した冊数と同じだけ受け取れます
          at: "%{at} から"
        wish:
          name: 欲しい本を希望順に並べる
          note: 自分が登録した本は選べません
          at: "%{at} から"
        published:
          name: 結果公開・ギフトコードを受け取る
          note: 誰から贈られたかも分かります
          at: "%{at} 以降"
      states:
        done: 終了
        current: 進行中
        upcoming: 予定
    # フェーズによる書き込み制御の対象になる操作
    operations:
      participation: 参加の変更
      book: 本の登録・編集
      wish: 希望リストの変更
      matching: マッチングの実行
    phase_violation: 現在は%{phase}のため、%{operation}はできません
    owner_locked: 主催者は交換会から抜けられません
    flash:
      created: 交換会を作成しました
      updated: 交換会を更新しました
  book:
    # 結果公開後にカードの下段へ出す1行（docs/spec.md 6.2）
    result:
      handover: "%{from} → %{to}"
      # 返却は誰にも渡せなかった本が登録者へ戻ること。失敗として見せない。
      # なぜ戻ったのかと、コードが手元に残っていることは結果画面が引き受ける
      returned_to_you: あなたに返却されました
      returned: "%{name}に返却"
      # 自分が受け取った本だけを立てる。十数枚並ぶ中から探し直さずに済む
      recipient_badge: あなたへ
    deletion_confirm: 「%{title}」の登録を取り消します。取得枠が%{before}冊から%{after}冊に減り、ギフトコードも消えます。よろしいですか？
    flash:
      # 登録した冊数がそのまま取得枠になるので、増えたことをその場で伝える
      created: 「%{title}」を登録しました。あなたの取得枠は%{count}冊になりました
      updated: 本の内容を更新しました
      destroyed: 本の登録を取り消しました
  invitation:
    from: "%{owner} さんからの招待"
    participants: "%{count}人が参加しています"
    description_label: 主催者からの説明
    schedule_label: どう進むか
    # 参加できるのは常に登録の締切まで。次の節目はフェーズで変わるので別に出す
    accepting_until: 参加できるのは登録の締切（%{at}）まで。
    next_milestone: "%{name}まで%{remaining}。"
    closed:
      heading: この交換会には参加できません
      # 締め出されたのではなく仕組みなのだと伝える。理由が無いと、
      # 主催者に掛け合えば入れてもらえるようにも読める
      reason: 本の登録期間が%{at}に終わりました。途中から加わると登録冊数と取得枠の釣り合いが崩れてしまうため、締切後の参加は受け付けていません。
      hint: 次の交換会に誘ってもらえるよう、%{owner} さんに伝えてみてください。
      schedule_label: この交換会の日程
      exchanges: 自分の交換会一覧へ
      exchanges_note: 概要と日程だけは、このまま見られます
  management:
    participants:
      exclude: 除外
      # 外すと本もギフトコードも一緒に消える。取り消せないので、押す前に断る。
      # 冊数は同じ行の登録冊数の欄に出ているので、ここでは繰り返さない
      exclude_confirm: "%{name} さんを交換会から外します。登録した本もあわせて取り消され、ギフトコードも消えます。招待URLを知っていれば、登録の締切までは本人が参加し直せます。よろしいですか？"
      # 押しても断られるボタンは出さないので、いつまで外せるのかを表に添える。
      # 書かないと、締切後に口が消えたことを不具合と読まれる
      exclusion_open: 参加者を外せるのは登録の締切（%{at}）まで。希望提出期間に入ってから抜けられると、登録冊数と取得枠の釣り合いが崩れてしまうためです。
      exclusion_closed: 登録の締切（%{at}）を過ぎたため、参加者を外すことはできません。
    # 登録冊数の偏りの警告（docs/spec.md 6.8）。自分が登録した本は受け取れないので、
    # 1人の登録冊数がほかの全員の合計を超えた分は、渡す相手がいないまま残る
    imbalance:
      eyebrow: 確認してください
      heading: 受け取り手のない本が%{returning}冊出ます
      # 何冊対何冊で釣り合っていないのかを書く。結果だけを出すと、
      # 誰に何冊足してもらえば収まるのかを主催者が数え直すことになる
      body: "%{name} さんが%{books}冊登録している一方、ほかの参加者は合わせて%{others}冊です。自分が登録した本は受け取れないため、%{returning}冊は渡す相手がいません。"
      # 消えるのではなく登録者へ戻る。コードの行方まで書かないと、
      # 未使用のギフトコードがどうなるのかを主催者が探すことになる
      returned: 余った本は %{name} さんに返却されます。ギフトコードは未使用のまま残ります。
      # 冊数だけから決まる下限。ドラフトは希望の上位から取っていくので、
      # 返却を避けられた組み合わせを取り逃すことがある。確定した数と読ませない
      at_least: 希望の出方によっては、これより増えることがあります。
      # 打つ手はこれだけ。減らすのは追加登録であって、多く登録した人を責めることではない
      remedy: 登録期間を延ばして、ほかの人に追加登録を促せば減らせます。
      remedy_link: 日程を変更
    invite_url:
      # 締切を過ぎるとこの URL からは参加できない（着地画面が断る）。
      # 人に渡す前に分かるよう、締切の日時ごと添える
      open: 参加できるのは登録の締切（%{at}）まで。URL を知っている人だけが参加できます。
      closed: 登録の締切（%{at}）を過ぎました。いまはこの URL からは参加できません。
      reissue: 再発行
      # 押すと古いURLが開けなくなる。すでに配ったあとに押されることがあるので、
      # 何が使えなくなり、何が残るのかを両方書く
      reissue_confirm: 招待URLを再発行します。いまのURLは開けなくなり、まだ参加していない人には新しいURLを渡し直すことになります。すでに参加している人は影響を受けません。よろしいですか？
    schedule:
      heading: 日程
      # 日時の入力欄は交換会の編集画面に1つだけ置く（docs/spec.md 6.9）。
      # ここは現在の日程を見せるだけで、変更はそちらへ送る
      edit: 変更
      # フェーズは状態カラムを持たず日時から導出する。締切を動かすと、
      # 参加者が次に画面を開いた時点ではなく、その場で効く
      note: 締切を動かすと、参加者の画面の残り時間もその場で変わります。
      # 結果公開後も日程は変更できる（docs/spec.md 6.9）。ただしフェーズは
      # マッチングを実行したかどうかで決まるので、締切を戻しても何も開き直らない。
      # 「表示だけが変わる」と書くより、再開しないものを名指しするほうが伝わる
      note_published: マッチングは実行済みです。日程を変更しても結果公開のままで、本の登録や希望の提出は再開しません。
    # マッチングの実行（docs/spec.md 6.8）。取り返しがつかず、一度しか実行できない
    matching:
      eyebrow: マッチング
      execute: マッチングを実行
      # 締切前。押せないボタンを残すのは、実行が主催者の仕事だと
      # 待っているあいだに知っておいてもらうため。締切後に初めて知らせると、
      # 誰かが自動でやってくれるものと思われたまま日が過ぎる
      waiting:
        heading: 締切後に、あなたが実行します
        body: 希望提出の締切（%{at}）を過ぎると、このボタンを押せるようになります。自動では実行されません。
      # 締切後。押し忘れが起きやすいので、ほかの情報を下へ押しやって大きく出す
      awaiting:
        eyebrow: あなたがすること
        heading: マッチングを実行してください
        body: 希望提出は%{at}に締め切られました。あなたが実行するまで、%{count}人は結果を見られません。
        # 何日放っておいたのかを、締切の日時から数えさせない
        elapsed: 締切から%{elapsed}経過しています。
        note: 確認画面が出ます。まだ確定しません
      # 実行の前に、思いどおりにならない点だけを挙げる。誰がそれに当たるかは
      # すぐ下の参加者一覧が持っているので、ここでは名前を並べず人数で出す
      checklist:
        heading: 実行前に確認しておくこと
        unsubmitted: 希望を出していない人が%{count}人います。余った本がランダムに割り当てられ、受け取る権利は失いません。
        without_books: 1冊も登録していない人が%{count}人います。取得枠が0なので、受け取り対象外です。
        # 実行するほかに、締切を延ばして待つ道もある。
        # 日時の入力欄は交換会の編集画面に1つだけ置く（docs/spec.md 6.9）
        extend: 締切を延ばして待つこともできます。
        extend_link: 希望提出期間を変更
      # 実行後。押せるものはもう無いので、いつ実行したかだけを残す
      done:
        heading: マッチングは実行済みです
        body: "%{at}に実行しました。割当は確定していて、やり直すことはできません。"
      # 実行前の確認画面。ブラウザのダイアログでは要約を並べられない。
      # 押す前に、何人に何冊が渡り、何が思いどおりにならないのかを数で示す
      confirm:
        eyebrow: 取り消せません
        heading: マッチングを実行しますか
        # ギフトコードの可視性が変わるのはこの操作だけ。実行の重みそのものなので、
        # 割当の確定と並べて書く
        body: 実行すると割当が確定し、全員に結果とギフトコードが公開されます。やり直すことはできません。
        target: 割当の対象
        # 1冊も登録していない人は取得枠が0で割当に現れない（docs/spec.md 6.9）。
        # 参加人数ではなく、実際に本を受け取る人数を出す
        target_value: "%{people}人 / %{books}冊"
        unsubmitted: 希望未提出
        # 希望を出していなくても余り物が回る。締め出されないことが伝わる書き方にする
        unsubmitted_value: "%{count}人（ランダム割当）"
        returning: 受け取り手のない本
        # 消えるのではなく登録者へ戻る。冊数だけを出すと、
        # 未使用のギフトコードの行方を主催者が探すことになる
        returning_value: "%{count}冊（登録者に返却）"
        # 飛ばし読みしたまま押されるのを防ぐ。ボタンだけでは、
        # 何が起きるかを読まずに済んでしまう
        acknowledge: 結果が全員に公開されること、やり直せないことを理解しました
        execute: 実行する
        # 押した瞬間にボタンが使えなくなれば、手が滑って二度押すこと自体が起きない
        submitting: 実行しています…
        cancel: やめる
    flash:
      invite_token_reissued: 招待URLを再発行しました。古いURLは開けなくなりました
      participant_excluded: "%{name} さんを交換会から外しました"
      matching_executed: マッチングを実行しました。結果とギフトコードが全員に公開されました
  # 結果画面（docs/spec.md 6.5）。数週間ずっと朱（締切）を見せてきた画面が、
  # ここで初めて松葉（成立）に変わる。祝祭は装飾ではなく面と色で作る
  result:
    published_at: "%{at} 公開"
    heading: あなたに%{count}冊 届きました
    # 誰から贈られたかが分かるようにする。お礼を伝えるため（docs/spec.md 6.5）
    senders: "%{names} が選んで置いていった本です。"
    from: "%{name} さんから"
    # 文の中に名前を並べるときの敬称。表の列は敬称を落とすので別に持つ
    person: "%{name} さん"
    order: "%{index}冊目 / %{total}"
    recommendation_label: "%{name} さんのおすすめポイント"
    # 登録フォームが「貼っておくと、受け取った人が同じ版を開けます」と約束している。
    # URL を持つ本だけ出す
    store: ストアで見る ↗
    gift_code:
      label: ギフトコード
      reveal: 表示
      copy: コピー
      # 見えるのは登録した本人と受け取った人だけ（docs/spec.md 8.）。
      # 主催者に特権が無いことは、本の登録フォームと同じ文で毎回書く
      note: 見えるのはあなたと %{name} さんだけ。ほかの参加者にも主催者にも見えません。
      # 誰にも渡らなかった本なので、相手がいない
      note_returned: 見えるのはあなただけです。未使用のまま残っています。
      # 急かさない。一度表示しても消えるものではない
      keep: 表示しても消えません。何度でも開けます。
      warning: 表示中です。周囲の画面共有にご注意ください。10秒後に自動で伏せ字に戻ります。
    # 受け取りが0冊のとき。枠が無かったのか、回ってこなかったのかを言い分ける。
    # 締め出されたのではなく仕組みの結果なので、そのことを書く
    empty:
      no_slots:
        heading: 今回、受け取る本はありません
        body: 受け取れる冊数は登録した冊数と同じで、登録期間に1冊も登録しなかったため0冊でした。次の交換会では、1冊出せば1冊受け取れます。
      none:
        heading: 今回は本が回ってきませんでした
        body: 出した冊数と同じだけ受け取れる仕組みですが、参加者と冊数の巡り合わせによっては、渡せる本が残らないことがあります。あなたが出した本は下に並んでいます。
    # 返却された自分の本（docs/spec.md 6.5 / 6.3）。受け取りの下に置き、順序で軽重を示す
    returned:
      eyebrow: あなたが出した本
      heading_one: 「%{title}」は戻ってきました
      heading_many: 出した本のうち%{count}冊が戻ってきました
      # 事実と、それが何を意味しないかを続けて書く。事実だけだと、
      # 選ばれなかったことを本の評価として読んでしまう
      body: 希望リストに入れた人がいなかった本は、スネークドラフトでは最後まで残り、登録した人へ戻ります。相性の問題で、本の善し悪しではありません。
      notes:
        - ギフトコードは未使用のまま、あなたの手元に残っています
        - 返却があっても、受け取る冊数（取得枠）は減りません
        - 次の交換会に、そのまま出せます
    # 自分が出した本の行き先。受け取ったものと同じくらい気になるので、
    # 全体の一覧に紛れさせず先に置く。
    # 何番目の希望で渡ったかは書かない。受け取った人の希望リストの中身にあたるうえ
    # （docs/spec.md 8.）、順位が低いと渡った事実より順位のほうが目に残る
    given:
      eyebrow: あなたが出した本の行き先
      to: "%{name} さんへ"
      returned: 戻ってきました
    # 全体の成立結果（docs/spec.md 6.5 下部）。誰が誰の本を受け取ったかは
    # 参加者全員に見える（docs/spec.md 8.）
    overall:
      heading: 全体の結果
      counts: 成立%{matched}冊・返却%{returned}冊
      # 一覧にコードが並ばないことを、毎回この画面でも書く。
      # 主催者に特権が無いことは本の登録フォームと同じ文で繰り返す
      note: ギフトコードは登録した本人と受け取った人にしか表示されません。ほかの参加者にも主催者にも見えません。
      columns:
        book: 本
        registrant: 登録した人
        recipient: 受け取った人
      # 自分の行を名前ではなく「あなた」にする。一覧の中から自分を探し出さずに済む
      you: あなた
      returned: 返却
    # ドラフトの抽選順（docs/spec.md 8.）。畳んでおく。
    # 巡ごとに順序が逆になるので、並びを見せても有利不利の話にはならない。
    # そのことを書かずに順番だけ出すと、早い人が得をしたように読める
    draft_order:
      summary: 抽選順を見る
      note: 参加者をランダムに並べ、この順に希望リストの上位から1冊ずつ確保します。次の巡では順序が逆になるため、早い遅いで有利不利は付きません。
    # 結果公開前に URL を直に開いたとき。素の 404 だと、URL を間違えたのか
    # 時期が早いのかを参加者が区別できない
    unpublished:
      heading: 結果はまだ公開されていません
      body: いまは%{phase}です。主催者がマッチングを実行すると、ここで結果とギフトコードを受け取れます。
      back: 交換会ページへ
  participation:
    flash:
      joined: 交換会に参加しました
      withdrawn: 交換会への参加を取り消しました
    login_required: "%{name}に参加するには、Google でのログインが必要です"
    # 別のタブで希望リストを変えたまま、古い並びを保存しようとしたとき
    wish_list_mismatch: 希望リストが変わっています。画面を読み直してから、もう一度並べ替えてください
  wish:
    # 希望リストに添える冊数の案内。取得枠は登録した冊数と同じで、
    # 推奨はその2倍（docs/spec.md 3.）。何人がその本を希望しているかは書かない
    slots_label: 取得枠
    slots_value: "%{count}冊（登録した本と同じ）"
    # 希望リストを開いている間の案内。counts 以外のキーは案内の状態そのもの
    guidance:
      counts: 取得枠%{slots}冊に対して希望%{wishes}冊
      short: もう少し増やすことを推奨します。上位が他の人に取られると下へ降りていくので、%{recommended}冊以上あると安心です。
      enough: 推奨する%{recommended}冊に届いています。締切まで並べ替えられます。
      # 登録期間はもう終わっているので、増やす道が残っていない。
      # 促す代わりに、いま何が起きるのかだけを書く
      no_slots: 登録期間に1冊も本を登録しなかったため、受け取れる本はありません。希望を並べても割り当てはありません。
    # 畳んでいる間の1行。狭い画面の既定の状態なので、
    # 開かなくても取得枠と希望冊数だけは読める短さにする
    summaries:
      counts: 枠%{slots}冊／希望%{wishes}冊
      shortfall: あと%{count}冊推奨
      no_slots: 枠0冊・受け取れません
  # Webhook でチャンネルへ投稿する通知（docs/spec.md 11.）。個人宛の通知は無く、
  # 誰が読むかを選べないので、ギフトコードと個人の希望リストの中身は書かない。
  # 促す相手は参加者全員なので、画面の「あなたがすること」（exchange.todos）とは
  # 別に持つ。あちらは自分の登録冊数や希望冊数で言うことが変わる
  notification:
    phase_change:
      headline:
        registration: 【%{name}】登録期間が始まりました
        wish: 【%{name}】希望提出期間が始まりました
        awaiting_matching: 【%{name}】希望の提出を締め切りました
        published: 【%{name}】結果を公開しました
      detail:
        registration: 贈りたい本を登録できます。登録した冊数と同じだけ受け取れます。
        wish: 本の登録は締め切りました。受け取りたい本を希望リストに並べてください。
        awaiting_matching: 主催者がマッチングを実行すると結果が出ます。
        # ギフトコードそのものは載せない。見えてよい人は受け取った本人だけなので、
        # 受け取る場所を案内するにとどめる（docs/spec.md 8.）
        published: 受け取った本とギフトコードを結果画面で確認できます。
      deadline: "%{name}: %{at}"
    # 締切前のリマインド（docs/spec.md 11.）。出すかどうかも本文も、交換会の日時だけ
    # から決める。参加者の状態は読まないので、人数も名前も文面に置ける材料が無い。
    # 「まだの人が3人います」を足したくなったときに、ここで材料が無いことが効く
    deadline_reminder:
      headline:
        registration: 【%{name}】登録の締切が近づいています
        wish: 【%{name}】希望提出の締切が近づいています
      detail:
        registration: 贈りたい本の登録は締切までです。登録した冊数と同じだけ受け取れます。
        wish: 希望リストの提出は締切までです。取得枠より少ない希望しか出していないと、受け取り損ねます。
      deadline: "%{name}: %{at}"
  # 例外から描かれるエラー画面（docs/spec.md 6.10）。
  # 何が起きたか → 次に押すもの の順で書き、原因の推測を並べない。
  # 数字は見出しにせず、控えとして code に置く。
  # 404 の本文は、参加していない交換会と存在しない交換会で同じでなければならない（8.）。
  # 片方にしか当てはまらない書き方をすると、文面そのものが実在を教える
  error:
    actions:
      exchanges: 交換会の一覧へ
      login: ログインする
    '400':
      code: 400 BAD REQUEST
      heading: この URL は読み取れませんでした。
      body: URL の一部が欠けているか、送信された内容が途中で壊れています。前の画面から操作をやり直してください。
    '404':
      code: 404 NOT FOUND
      heading: このページはありません。
      body: URL が間違っているか、招待を受けていないページです。心当たりがあるときは、主催者に招待URLをもう一度もらってください。
    '422':
      code: 422 UNPROCESSABLE CONTENT
      heading: この操作は受け付けられませんでした。
      body: ページを開いたまま時間が経つと起きます。読み込み直してから、もう一度お試しください。登録した本や希望リストはそのままです。
    # フェーズや役割が許さない書き込みを断ったとき。理由の一文は例外が持つので、
    # ここが持つのは組み立てのぶんだけ。409 と 403 で言い分けない。
    # 断られた人がすることは、どちらも「いまどうなっているかを読んで交換会へ戻る」
    denied:
      code: 受付終了
      heading: いまはこの操作ができません。
      back: 交換会ページへ
  activerecord:
    attributes:
      book:
        title: タイトル
        summary: あらすじ
        url: URL
        recommendation: おすすめポイント
        gift_code: ギフトコード
      exchange:
        name: 交換会名
        description: 概要
        webhook_url: Webhook URL
        invite_token: 招待トークン
        random_seed: 乱数シード
        registration_starts_at: 登録期間の開始日時
        registration_ends_at: 登録期間の終了日時
        wish_ends_at: 希望提出期間の終了日時
      wish:
        book: 本
        position: 順位
    errors:
      models:
        wish:
          attributes:
            book:
              own_book: は自分が登録したものです。自分の本は受け取れません
              other_exchange: はこの交換会のものではありません
        exchange:
          attributes:
            registration_ends_at:
              before_start: は開始日時より後にしてください
              # 作成時のみ。主催者は作成と同時に参加者になるため、
              # 締切を過ぎた日程では交換会そのものを作れない
              deadline_passed: は現在より後にしてください
            wish_ends_at:
              before_start: は開始日時より後にしてください
