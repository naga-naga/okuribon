<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>表示できませんでした — おくりぼん</title>

    <!--
      このファイルはアプリのレイアウトを通らない。500 が出ている状況では
      DB もセッションも読めないことがあり、ビューを通すとエラー画面そのものが
      描けなくなるため（docs/spec.md 6.10）。
      配色は app/assets/tailwind/application.css の @theme と同じ値を写している。
      Tailwind のビルド結果を参照できないので、ここだけは生の色コードで書く。
      片方を変えたらもう片方も変えること。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">

    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        background: #f4f0e8; /* surface 生成り */
        color: #26211c; /* ink 墨 */
        font-family: "Zen Kaku Gothic New", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 共通ヘッダーは出せない。ログアウトも利用者名も DB を要る。
         ここに残すのは、どのサービスの画面かが分かるだけの帯にする */
      .header {
        border-bottom: 1px solid #ded6c8; /* line */
        background: #fbf8f2; /* paper 紙 */
        padding: 14px 24px;
      }

      .header-inner {
        margin: 0 auto;
        max-width: 1180px;
      }

      .mark {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 2px;
        background: #8c3a2b; /* accent 朱 */
        vertical-align: -2px;
      }

      .service {
        margin-left: 8px;
        font-size: 14px;
        font-weight: 700;
      }

      main {
        margin: 0 auto;
        max-width: 560px;
        padding: 64px 24px 96px;
      }

      .code {
        display: block;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: #8a8074; /* ink-subtle */
      }

      h1 {
        margin: 24px 0 0;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.5;
      }

      p {
        margin: 24px 0 0;
        font-size: 14.5px;
        line-height: 2;
      }

      .action {
        display: inline-block;
        margin-top: 28px;
        border-radius: 5px;
        background: #8c3a2b; /* accent */
        padding: 14px 24px;
        color: #fbf8f2;
        font-size: 14.5px;
        font-weight: 500;
        text-decoration: none;
      }

      .action:hover {
        background: #75301f; /* accent-hover */
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="header-inner">
        <span class="mark"></span><span class="service">おくりぼん</span>
      </div>
    </div>

    <main>
      <span class="code">500 SERVER ERROR</span>
      <h1>こちらの不具合で<br>表示できませんでした。</h1>
      <p>
        登録した本も希望リストも失われていません。少し待ってから、ページを読み込み直してください。
        何度も続くようなら、しばらく時間をおいてからお試しください。
      </p>
      <a class="action" href="/">交換会の一覧へ</a>
    </main>
  </body>
</html>
