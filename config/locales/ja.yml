ja:
  time:
    formats:
      # 日程の表示。rails-i18n の :long は秒まで出るため、分までの書式を別に持つ
      schedule: "%Y年%-m月%-d日 %H:%M"
  exchange:
    phases:
      preparing: 準備中
      registration: 登録期間
      wish: 希望提出期間
      awaiting_matching: マッチング実行待ち
      published: 結果公開
    # 次に来る節目の呼び名。次の節目が無いフェーズは持たない
    next_deadlines:
      preparing: 登録期間の開始
      registration: 登録の締切
      wish: 希望提出の締切
    # 招待画面が見せる日程の3段。日時だけを並べても参加の判断材料にならないので、
    # その期間に何をするのかと、そこで効く決まりを添える。
    # 結果公開だけ「以降」にするのは、公開が主催者の実行で起き、日時で決まらないため
    schedule:
      steps:
        registration:
          name: 本を登録する
          note: 登録した冊数と同じだけ受け取れます
          at: "%{at} から"
        wish:
          name: 欲しい本を希望順に並べる
          note: 自分が登録した本は選べません
          at: "%{at} から"
        published:
          name: 結果公開・ギフトコードを受け取る
          note: 誰から贈られたかも分かります
          at: "%{at} 以降"
      states:
        done: 終了
        current: 進行中
        upcoming: 予定
    # フェーズによる書き込み制御の対象になる操作
    operations:
      participation: 参加の変更
      book: 本の登録・編集
      wish: 希望リストの変更
      matching: マッチングの実行
    phase_violation: 現在は%{phase}のため、%{operation}はできません
    owner_locked: 主催者は交換会から抜けられません
    flash:
      created: 交換会を作成しました
      updated: 交換会を更新しました
  book:
    # 一覧の見出しに添える一文。登録期間と希望提出期間で数週間かかるので、
    # 久しぶりに開いた人が、その日なにをすればよいかをここだけで掴めるようにする。
    # 次に待つ日時が無いフェーズ（マッチング実行待ち・結果公開）は %{at} を使わない
    index_guides:
      preparing: 登録期間はまだ始まっていません。本の登録は%{at}からです。
      registration: おすすめポイントを読んで、欲しい本の見当をつけておきましょう。希望の提出は%{at}から。
      wish: 欲しい本を希望順に並べましょう。希望提出の締切は%{at}です。
      awaiting_matching: 希望の受付は終わりました。主催者がマッチングを実行すると結果が出ます。
      published: 交換の結果が公開されています。
    deletion_confirm: 「%{title}」の登録を取り消します。取得枠が%{before}冊から%{after}冊に減り、ギフトコードも消えます。よろしいですか？
    flash:
      # 登録した冊数がそのまま取得枠になるので、増えたことをその場で伝える
      created: 「%{title}」を登録しました。あなたの取得枠は%{count}冊になりました
      updated: 本の内容を更新しました
      destroyed: 本の登録を取り消しました
  invitation:
    from: "%{owner} さんからの招待"
    participants: "%{count}人が参加しています"
    description_label: 主催者からの説明
    schedule_label: どう進むか
    # 参加できるのは常に登録の締切まで。次の節目はフェーズで変わるので別に出す
    accepting_until: 参加できるのは登録の締切（%{at}）まで。
    next_milestone: "%{name}まで%{remaining}。"
    closed:
      heading: この交換会には参加できません
      # 締め出されたのではなく仕組みなのだと伝える。理由が無いと、
      # 主催者に掛け合えば入れてもらえるようにも読める
      reason: 本の登録期間が%{at}に終わりました。途中から加わると登録冊数と取得枠の釣り合いが崩れてしまうため、締切後の参加は受け付けていません。
      hint: 次の交換会に誘ってもらえるよう、%{owner} さんに伝えてみてください。
      schedule_label: この交換会の日程
      exchanges: 自分の交換会一覧へ
      exchanges_note: 概要と日程だけは、このまま見られます
  participation:
    flash:
      joined: 交換会に参加しました
      withdrawn: 交換会への参加を取り消しました
    login_required: "%{name}に参加するには、Google でのログインが必要です"
  activerecord:
    attributes:
      book:
        title: タイトル
        summary: あらすじ
        url: URL
        recommendation: おすすめポイント
        gift_code: ギフトコード
      exchange:
        name: 交換会名
        description: 概要
        webhook_url: Webhook URL
        invite_token: 招待トークン
        random_seed: 乱数シード
        registration_starts_at: 登録期間の開始日時
        registration_ends_at: 登録期間の終了日時
        wish_ends_at: 希望提出期間の終了日時
    errors:
      models:
        exchange:
          attributes:
            registration_ends_at:
              before_start: は開始日時より後にしてください
              # 作成時のみ。主催者は作成と同時に参加者になるため、
              # 締切を過ぎた日程では交換会そのものを作れない
              deadline_passed: は現在より後にしてください
            wish_ends_at:
              before_start: は開始日時より後にしてください
