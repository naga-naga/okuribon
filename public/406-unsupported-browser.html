<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>このブラウザでは表示できません — おくりぼん</title>

    <!--
      allow_browser（ApplicationController）がこのファイルを直に描く。
      exceptions_app は通らないので、静的 HTML のまま揃える。

      ここへ来た人のブラウザは、この道具が前提にしている CSS を読めない。
      Tailwind のビルド結果も @theme も当てにできないため、配色だけを
      app/assets/tailwind/application.css から写し、組み方は素朴に保つ。
      flex も gap も grid も使わない。使えないから来ている画面なので。
    -->
    <style>
      body {
        margin: 0;
        background: #f4f0e8; /* surface 生成り */
        color: #26211c; /* ink 墨 */
        font-family: sans-serif;
      }

      .header {
        border-bottom: 1px solid #ded6c8; /* line */
        background: #fbf8f2; /* paper 紙 */
        padding: 14px 24px;
      }

      .mark {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 2px;
        background: #8c3a2b; /* accent 朱 */
      }

      .service {
        margin-left: 8px;
        font-size: 14px;
        font-weight: bold;
      }

      .body {
        margin: 0 auto;
        max-width: 560px;
        padding: 64px 24px 96px;
      }

      .code {
        display: block;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #8a8074; /* ink-subtle */
      }

      h1 {
        margin: 24px 0 0;
        font-size: 26px;
        line-height: 1.5;
      }

      p {
        margin: 24px 0 0;
        font-size: 15px;
        line-height: 2;
      }

      .note {
        margin-top: 32px;
        border-top: 1px solid #ded6c8;
        padding-top: 20px;
        font-size: 13px;
        color: #6b6259; /* ink-muted */
      }
    </style>
  </head>

  <body>
    <div class="header">
      <span class="mark"></span><span class="service">おくりぼん</span>
    </div>

    <div class="body">
      <span class="code">406 NOT ACCEPTABLE</span>
      <h1>このブラウザでは表示できません。</h1>
      <p>
        お使いのブラウザが古いため、画面を正しく描けません。
        Chrome・Safari・Edge・Firefox のいずれかを新しい版に更新してから、もう一度開いてください。
      </p>
      <p class="note">
        交換会に登録した本や希望リストは、そのまま残っています。
        新しいブラウザで開き直せば、続きから使えます。
      </p>
    </div>
  </body>
</html>
