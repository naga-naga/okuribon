# RuboCop の標準設定を出発点にする。
# 好みに合わない cop が出てきたら、その都度ここへ書き足す。

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

# 自作 cop。plugin gem ではないので require で読む。
# 置き場所は lib/ ではなく .rubocop/ にしている。lib/ は config.autoload_lib の
# 対象で、Zeitwerk が RuboCop を Rubocop と読もうとして解決に失敗するため
require:
  - ./.rubocop/cop/okuribon/current_time.rb

AllCops:
  NewCops: enable
  # 隠しディレクトリは既定で走査対象外なので、自作 cop 自身を明示的に含める
  Include:
    - "**/*.rb"
    - ".rubocop/cop/**/*.rb"
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "node_modules/**/*"
    - "storage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# --- 記法の好み ---

# %i[] %w[] は使わず、素直に [] で書く
Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

# 複数行のハッシュと配列は末尾要素にもカンマを付ける（差分を小さく保つため）。
# メソッド引数は対象にしない
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

# 行数や複雑度を数値で機械的に縛らない
Metrics:
  Enabled: false

# --- spec の書き方 ---

# spec は日本語で書くため、英語の語順を前提にした cop は使わない
RSpec/ContextWording:
  Enabled: false

# ひとつの example で複数の側面を確かめたい場面が多い
RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

# クラス以外の振る舞いを describe することがある
RSpec/DescribeClass:
  Enabled: false

# --- Rails の慣習 ---

# クラスに説明コメントを必須としない
Style/Documentation:
  Enabled: false

# --- 現在時刻の取得経路 ---

# 現在時刻は Current.time に一本化する（フェーズを日時から導出するため）。
# 対象はアプリケーションコードだけ。config・spec・マイグレーションは実時刻を直接扱う
Okuribon/CurrentTime:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"
  Exclude:
    - "app/models/current.rb"
