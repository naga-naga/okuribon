service: okuribon

image: okuribon

require_destination: true

registry:
  server: 000000000000.dkr.ecr.ap-northeast-1.amazonaws.com
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

# AWS の AMI は root のログインを塞いでいる
ssh:
  user: ubuntu

builder:
  arch: amd64

proxy:
  ssl: true
  healthcheck:
    path: /up

env:
  clear:
    SOLID_QUEUE_IN_PUMA: true
  secret:
    - RAILS_MASTER_KEY
    - OKURIBON_DATABASE_PASSWORD

accessories:
  db:
    image: postgres:17
    env:
      clear:
        POSTGRES_USER: okuribon
      secret:
        - POSTGRES_PASSWORD
    # ポートを公開しない。1台に両方の環境を載せると 5432 を取り合う。
    # アプリは kamal のネットワークからコンテナ名で引くので、公開しなくても届く
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

asset_path: /rails/public/assets
