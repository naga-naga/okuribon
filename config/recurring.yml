# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

shared: &shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # フェーズの変わり目を拾う。締切は主催者が分単位で決められるので、
  # 通知は最大でこの間隔だけ遅れる。数週間かかる交換会で5分の遅れは効かない。
  # 1分ごとにすると、変わり目の無い走査を1日1440回することになる
  notify_phase_changes:
    class: Notifications::PhaseScanJob
    schedule: every 5 minutes

# 開発でも同じ定期実行を読ませる。定期実行が設定から拾われているかは
# solid_queue_recurring_tasks の行でしか分からず、production にしか
# 定義が無いと、手元では締切前のリマインド（#44）を確かめる足場が無い
development:
  <<: *shared

production:
  <<: *shared
