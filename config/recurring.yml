# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

shared: &shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # 予約（Notifications::NotifyPhaseChangeJob）を取りこぼした交換会を拾う網。
  # 変わり目そのものは予約が拾うので、ここは頻度を落として1日1回でよい。
  # 網が要るのは、予約が queue のデータベースにしか無いため。積み損ねても、
  # ジョブが失敗して止まっても、予約は自分では戻ってこない。
  # 朝に置くのは、拾った通知がその場で投稿されるため。深夜に出しても読まれない
  notify_all_phase_changes:
    class: Notifications::NotifyAllPhaseChangesJob
    schedule: every day at 9am
  # 予約（Notifications::RemindDeadlineJob）を取りこぼした交換会を拾う網。
  # 間隔をリマインドのウィンドウ（Notifications::DeadlineReminder::WINDOW）と同じ24時間に
  # 揃えてある。空けると、取りこぼした締切が一度もウィンドウに入らないまま過ぎる。
  # 変わり目の網と同じ時刻でよい。どちらも交換会の日時しか読まない
  remind_all_deadlines:
    class: Notifications::RemindAllDeadlinesJob
    schedule: every day at 9am

# 開発でも同じ定期実行を読ませる。定期実行が設定から拾われているかは
# solid_queue_recurring_tasks の行でしか分からず、production にしか
# 定義が無いと、手元では締切前のリマインドを確かめる足場が無い
development:
  <<: *shared

production:
  <<: *shared
