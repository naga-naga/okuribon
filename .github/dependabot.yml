version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # 公開直後の版を掴まないよう寝かせる。
  # cooldown は version update にのみ効き、security update は素通しになる
  cooldown:
    default-days: 7
    semver-major-days: 30
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # github-actions は default-days のみ対応で、SemVer 系のキーは効かない
  cooldown:
    default-days: 7
